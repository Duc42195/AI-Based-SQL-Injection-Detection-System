# Central configuration for the SQLi Detection System.
# Nothing thresholds/paths/timeouts related should be hardcoded in modules.
# Override any value at runtime via env vars: SQLIDS_<SECTION>_<KEY>
# e.g. SQLIDS_DECISION_OVERKILL_TIMEOUT_SECONDS=120

project:
  name: "ai-sqli-detection"
  random_seed: 42

logging:
  level: "INFO"

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_adversarial: "data/adversarial"
  models_dir: "models"
  # Directory holding evaluation/report JSON artifacts (served by the metrics API).
  reports_dir: "report/metrics"
  # DEPRECATED generic active version — kept for backward-compat but unused; the
  # real model folders are versioned per-branch (see each branch's
  # `active_version` below, e.g. branch1_supervised.active_version,
  # branch2_anomaly.active_version).
  active_version: "v0"

preprocessing:
  # Max decode passes for nested/multi-layer encoding (URL/hex/CHAR()).
  max_decode_iterations: 3
  lowercase_keywords: true
  mark_comments: true

# Multi-class label schema for Branch 1 (adjust to what the data actually has).
# Branch 3 (session) inherits these as its per-query base labels.
labels:
  classes:
    normal: 0
    union_based: 1
    error_based: 2
    boolean_blind: 3
    time_blind: 4
    stacked: 5

branch1_supervised:
  # RECHOSEN (27/8) after the D3/Superviz25 integration + TF-IDF retune made
  # the per-class gap material rather than negligible: DistilBERT reaches
  # 0.921 F1 on `stacked` and 0.978 on `time_blind` vs tfidf_logreg's 0.700
  # and 0.812 (report/metrics/branch1_architecture_comparison.json), the two
  # classes this project's own results discuss at length as weak. Its
  # latency (2.8ms) is real-time-compatible - the "too slow" objection that
  # ruled out LightGBM at pre-retune latencies does not apply to DistilBERT.
  # Cost: needs a GPU to train, a 256MB artifact (vs 0.4MB), ~33min train
  # time - accepted for the per-class accuracy gain. tfidf_logreg remains
  # available (train/compare_branch1_architectures.py) as the fallback with
  # no GPU/deep-learning-framework dependency.
  #   "tfidf_logreg"  |  "tfidf_lightgbm"  |  "distilbert"  |  "cnn_sqltok"
  architecture: "distilbert"
  multiclass: true
  # Model folder under models_dir loaded by the API at inference time
  # (models/<active_version>/ - {model.joblib,vectorizer.joblib} for
  # tfidf_logreg, or a Hugging Face model directory for distilbert; see
  # src/models/branch1_loader.py for the architecture-agnostic loader).
  active_version: "branch1_v1"
  # Probability threshold above which a query is flagged as SQLi (any attack class).
  decision_threshold: 0.5
  tfidf:
    # RETUNED 27/8 via grid search (train/grid_search_branch1_tfidf.py) once
    # D6/Superviz25 widened the gap to the other architectures (Table
    # b1arch): ngram_min/max=(2,4) was carried over un-tuned from the
    # earlier all-models-~0.99 era. Shorter n-grams monotonically improved
    # F1-macro on the harder 6-class data (ngram(2,4)=0.8352 -> (1,4)=0.8499
    # -> (1,3)=0.8623 -> (1,2)=0.8941), and C=10 nudged it further to
    # 0.8977 - both changes together. Also shrinks the vocabulary (~5K vs
    # 50K), so the deployed model is smaller and no slower.
    analyzer: "char_wb"
    ngram_min: 1
    ngram_max: 2
    max_features: 50000
    C: 10.0
  distilbert:
    pretrained: "distilbert-base-uncased"
    max_length: 128
    batch_size: 32
    epochs: 3
    learning_rate: 5.0e-5
  cnn_sqltok:
    # SQL-keyword-aware tokenizer + small 1D-CNN (~69K params reference
    # architecture from the Related Work survey - a lightweight alternative
    # to a full transformer).
    vocab_size: 2000
    max_length: 128
    embedding_dim: 32
    num_filters: 64
    kernel_sizes: [3, 4, 5]
    epochs: 5
    batch_size: 64
    learning_rate: 1.0e-3
  # Per-class undersample target when building data/processed/branch1_train.csv.
  # Classes with fewer available rows than this are kept in full (see
  # data_contract.md Muc 2.1).
  balance:
    target_per_class: 15000
    test_fraction: 0.2
    # Deduplicate rows by `query_canonical` BEFORE the train/test split. Fixes
    # the cross-split leakage found in the Branch-1 audit (949 identical texts
    # straddled train & test, 4,277 extra copies) which made the eval F1
    # "slightly optimistic" - a model could memorise a text in train and see it
    # again in test. See report/metrics/audit_branch1/audit_report.md (Mảng 2).
    dedup_query_canonical: true
    # RE-ENABLED 26/8: `stacked` (5) was excluded (16/7) because the only
    # source was 363 synthetic templated payloads (100% recall across all 4
    # compared architectures - trivially separable, not a real quality
    # signal). D6 (Superviz25, see data_contract.md) now provides ~20k REAL
    # sqlmap-generated stacked examples - exactly the condition this
    # exclusion was waiting on ("re-enable once real stacked-query examples
    # are available"). Synthetic generation (src/preprocessing/
    # synthetic_stacked.py) is no longer used by build_branch1_dataset.py but
    # is kept for train/build_mlops_split.py, which still needs it.
    exclude_labels: []
    # Reservoir-sample caps for D6 (Superviz25) - see load_d6_superviz25.
    # attack_technique_cap is per mapped class (union/error/boolean/time/
    # stacked); all 5 have far more available (24.7k-203.8k) than this cap,
    # kept above target_per_class so undersampling + group-aware split still
    # has enough campaigns to choose from. benign_cap is generous since
    # Branch 2 (no per-class cap) draws from the same loaded pool.
    d6_benign_cap: 50000
    d6_attack_technique_cap: 20000

branch2_anomaly:
  # D6 (Superviz25) reservoir-sample caps, see load_d6_superviz25 and the
  # module docstring of train/build_branch2_dataset.py for why this source
  # was added (69-95% zero-shot FPR on D6 benign traffic before this fix).
  # benign_cap generous since Branch 2 wants as much benign diversity as
  # possible; attack_technique_cap only feeds the anomalous eval set here
  # (Branch 2 never trains on attack rows).
  d6_benign_cap: 50000
  d6_attack_technique_cap: 20000
  # Trained on BENIGN ONLY. Output is a continuous anomaly score used both as a
  # per-query zero-day flag and as an extra feature dim fed into Branch 3.
  # "isolation_forest" | "one_class_svm" | "local_outlier_factor"
  #
  # CHANGED 19/08 (one_class_svm -> local_outlier_factor): the benign pool
  # spans 3 structurally distinct sub-populations (D1 bare SQL text, D3/D7
  # HTTP query-parameter text — see `features`/data_file comments below), a
  # shape single-boundary estimators (OCSVM/IsolationForest) handle poorly —
  # a query that's merely "not from D3" can look anomalous to a
  # D3-influenced boundary even when genuinely benign D1/D7 traffic. LOF
  # judges each point against its own nearest neighbours (local density)
  # rather than one global boundary, so cross-domain shape differences don't
  # get mistaken for attacks the same way. Full comparison (OCSVM/
  # IsolationForest/GaussianMixture/EllipticEnvelope/LOF, several
  # hyperparameter grids): report/conf/project_history.md §3.
  algorithm: "local_outlier_factor"
  # Model folder under models_dir (created once Branch 2 is trained). Until then
  # the API reports this branch as "not_ready" instead of crashing.
  active_version: "branch2_v1"
  # Benign-pool CSVs (under paths.data_processed). Post-cleanup (14/08, see
  # report/plan/solution_branch2_cleanup.md) these point at the SSRF-removed /
  # short-string-rebalanced files, not the originals build_branch2_data.py
  # writes directly — run train/clean_branch2_data.py after
  # train/build_branch2_data.py to (re)generate them.
  #
  # UPDATED 19/08: build_branch2_dataset.py now also strips the HTTP
  # scheme/host/path off D3/D7 rows (kept only for content captured as full
  # HTTP requests — D1 is already query-shaped) — see that script's
  # docstring and report/conf/project_history.md §1/§3 for why (the system
  # is deployed at "Position B" / DB proxy, which only ever sees a built SQL
  # statement, never a raw HTTP request). The anomalous eval set now also
  # includes D1 + D7 attack rows (previously D3 only).
  data_file: "branch2_data_clean.csv"
  anomalous_eval_file: "branch2_anomalous_eval_clean.csv"
  # Expected fraction of anomalies in the (Normal) training data.
  # NOTE: training data is 100 % benign (0 % anomaly), so this should be very
  # small — IF='auto' uses the algorithm's own estimate; OCSVM default nu=0.001.
  # Shared/fallback contamination — each algorithm can override with its own
  # key below (ocsvm_nu, lof_contamination); Isolation Forest uses this one
  # directly.
  contamination: 0.01
  # One-Class SVM specific hyperparameters — kept for reference /
  # `branch2_anomaly.tune` comparisons even though LOF is the active
  # algorithm (see `algorithm` comment above). nu=0.001/gamma=0.01 was the
  # 17/08 tuned result on the (pre-19/08) 3-feature/D3-only setup:
  # AUC=0.792, DR=26.2% at matched FPR=5%.
  ocsvm_nu: 0.001
  ocsvm_gamma: 0.01
  # Isolation Forest — max_samples=1.0 (each of the 500 trees sees the FULL
  # training set, not sklearn's default 256-row random subsample) mattered
  # far more than n_estimators for this multi-domain pool: a small random
  # subsample often doesn't represent all 3 domains, so trees partition
  # poorly. Kept as a documented runner-up (AUC=0.837, DR=61.4%) — LOF beat
  # it (AUC=0.900, DR=80.0%), see `algorithm` comment.
  if_max_samples: 1.0
  # Local Outlier Factor — ACTIVE algorithm. n_neighbors=5 won a sweep of
  # [5, 8, 10, 12, 15, 20, 25, 30, 50, 100, 200, 500] on validation AUC (the
  # curve is flat across 5-25, not a sharp overfit spike at the smallest
  # value tried — report/conf/project_history.md §3). contamination only
  # affects `predict()`'s binary threshold, not `score()` (which every
  # eval/calibration script here uses instead) — set to roughly match the
  # matched-FPR=5% operating point used for reporting.
  lof_n_neighbors: 5
  lof_contamination: 0.05
  # Scale all features with StandardScaler before training — required for
  # LOF (a distance-based method) even more than it was for OCSVM's RBF
  # kernel, since the 12 features below are on very different raw scales
  # (e.g. length ~10-1000s vs quote_imbalance 0/1/2).
  scale_features: true
  # log1p-transform the right-skewed count/length features before scaling —
  # these have long tails (a handful of very long queries/tokens/runs) that
  # would otherwise dominate Euclidean distance for LOF's k-NN lookups.
  log_transform_features:
    - "length"
    - "max_token_length"
    - "max_special_run"
    - "max_digit_run"
  # Statistical/structural features extracted per query (not TF-IDF - Branch 2
  # needs to generalize to unseen syntax, so features describe SHAPE not content).
  #
  # BUG FOUND AND FIXED 16/08 (train/build_branch2_data.py): the benign
  # training pool was being built from `branch1_train.csv` filtered to
  # label==0 — Branch 1's dataset, PER-CLASS-UNDERSAMPLED to 15,000 "normal"
  # rows and, critically, containing ONLY the d1_sqliv3 + d7_srbh2020_normal
  # sources. The anomalous eval set is 100% d3_csic2010. So the benign pool
  # was missing an entire source that the eval set is entirely drawn from —
  # a domain-shift confound, not just "6x less data". Fixed by loading the
  # dedicated, uncapped `branch2_normal.csv` (all of D1+D3+D7, no per-class
  # cap — the design this project always intended, see
  # report/plan/data_contract.md §3.2) that was already published on the HF
  # dataset repo the whole time.
  #
  # This exposed that the previously-chosen feature `bigram_entropy` (15/08)
  # was itself mostly riding this confound (see git history / previous
  # versions of this comment block for the exact numbers) — replaced 17/08
  # by `quote_imbalance` (count of unclosed single/double quotes).
  #
  # UPDATED 19/08 (3 features -> all 12): a follow-up finding showed *why*
  # D3/D7 stayed harder than D1 even with quote_imbalance — D3/D7 rows are
  # full HTTP query-parameter strings (`key=value&key=value&...`), so a
  # WHOLE-STRING ratio feature (special_char_ratio, quote_imbalance) gets
  # diluted by all the legitimate `&`/`=`/`.` syntax surrounding a small
  # injected payload (measured effect size on special_char_ratio: |d|=1.69
  # on D1, only |d|=0.12 on D3 — report/plan/data_contract.md). Added 6
  # "local peak" features (same_type_run_ratio, max_token_length,
  # token_count, max_special_run, max_digit_run, paren_imbalance — see
  # src/preprocessing/statistical_features.py) that look for a local run/
  # token rather than a whole-string average, so they aren't diluted the
  # same way. Combined with the D3/D7 URL-wrapper strip (`data_file` comment
  # above) and switching to LOF (`algorithm` comment above), this raised
  # DR@matched-FPR5% from 26.2% to 80.0% (AUC 0.79 -> 0.90) on a combined
  # D1+D3+D7 eval. Using ALL 12 features (not a hand-picked subset) won a
  # forward/backward stepwise search by a wide margin once the estimator
  # became LOF — full account: report/conf/project_history.md §3.
  #
  # CAVEAT: as before, this subset was chosen by scoring candidates directly
  # against the held-out anomalous eval set (no separate feature-selection
  # validation split) — somewhat optimistic (selection-on-test bias).
  features:
    - "length"
    - "special_char_ratio"
    - "sql_keyword_count"
    - "entropy"
    - "bigram_entropy"
    - "quote_imbalance"
    - "same_type_run_ratio"
    - "max_token_length"
    - "token_count"
    - "max_special_run"
    - "max_digit_run"
    - "paren_imbalance"
  # Held-out split of the benign pool for evaluating FPR (build_branch2_dataset.py).
  test_fraction: 0.2
  # Hyperparameter tuning via grid search (disabled by default; enable for
  # production).
  tune:
    enabled: false
    validation_fraction: 0.2
    scoring: "roc_auc"
    # Grids are expanded as Cartesian product.
    isolation_forest:
      n_estimators: [100, 500]
      max_samples: [0.5, 1.0]
      contamination: [0.001, 0.005, 0.01, "auto"]
    one_class_svm:
      gamma: ["scale", "auto", 0.1, 0.01]
      contamination: [0.001, 0.005, 0.01, 0.05]
    local_outlier_factor:
      n_neighbors: [5, 10, 20, 50]
      contamination: [0.02, 0.05]

branch3_session:
  # Session Correlator (formerly "Branch 3"). NOT a trained model: it re-uses
  # Branch 1's classifier (content check, on concatenated session text) and
  # Branch 2's anomaly detector (behavior check, aggregating its per-query
  # scores) exactly as already trained, and correlates the two signals per
  # session. Kept under the `branch3_session` key / `/branch3` API prefix for
  # backward compatibility (config schema + frontend contract), not because
  # it is still an independent "branch". See src/models/branch3_session.py
  # (SessionCorrelator) and report/plan/data_contract.md §4.2 for why the
  # earlier GRU sequence-model design (kept there for the record) was
  # replaced. Session = session-id, or (client IP + idle-gap window).
  enabled: true
  # Model folder under models_dir (created once thresholds are calibrated).
  # Until then the API reports this branch as "not_ready" instead of crashing.
  active_version: "branch3_v2"
  session_idle_gap_seconds: 1800   # 30-min inactivity ends a session
  # Session label schema (0=benign; attack types that only appear across queries).
  session_classes:
    benign: 0
    boolean_blind: 1
    time_blind: 2
    query_splitting: 3
  # Cách A (simulated) session dataset — see train/build_session_dataset.py.
  # Sessions are built from existing Branch 1 labeled queries rather than real
  # captured traffic (that's Cách B, sqlmap+Docker-lab, not yet done).
  cach_a:
    sessions_per_class: 350
    min_len: 2
    max_len: 10
    # [min, max] seconds between steps — benign traffic is human-paced,
    # attack probing (boolean/time-blind, query-splitting) is scripted/rapid.
    benign_step_gap_seconds: [10, 120]
    attack_step_gap_seconds: [1, 15]
    # query_splitting sessions are synthesized by fragmenting one real attack
    # payload into this many pieces (no per-query "splitting" label exists in
    # the source data, so there's nothing to sample directly).
    splitting_fragments: [2, 4]
    test_fraction: 0.2
    # benign/boolean_blind/time_blind are generated by ACTUALLY running a real
    # bisection attack against deploy/demo_db.py (see train/attack_simulator.py)
    # instead of sampling/guessing — real row differences, real measured
    # timing. query_splitting is unaffected (stays on the fragmentation
    # heuristic above; no second vulnerable parameter exists yet to build a
    # realistic multi-parameter-probing scenario).
    real_db:
      target_column: "password"
      # Cap real bisection extraction to the first N characters — a session
      # doesn't need to recover the WHOLE password to demonstrate the
      # bisection pattern, and each extra character costs ~7 more requests
      # (or ~7 x sleep_seconds of real wall-clock time for time-blind).
      max_extract_chars: 4
      # Real SLEEP() duration for time-blind probes. Small on purpose: still
      # trivially distinguishable from a ~1ms in-memory SQLite query, but
      # keeps a 350-session x ~35-probe-per-session generation run fast.
      time_blind_sleep_seconds: 0.05
      # Size of the randomized user pool generated ONLY for training-data
      # diversity (train/attack_simulator.py:generate_synthetic_user_pool) —
      # NOT the live demo's 5-row table. The bisection algorithm is
      # deterministic given a target value, so attacking a small fixed pool
      # produces only that-many distinct traces, repeated, no matter how
      # many "sessions" are generated (confirmed empirically: 5 users -> 5
      # traces repeated ~70x each -> the model memorized instead of
      # generalizing). 100 keeps most of the 350 sessions/class unique.
      synthetic_user_pool_size: 100
  # SessionCorrelator threshold calibration — see train/calibrate_branch3.py.
  # Not model hyperparameters (there is no gradient training); the content
  # check reuses branch1_supervised.decision_threshold directly, only the
  # behavior-check thresholds below are calibrated from data.
  aggregate:
    # Percentile of TRAIN benign per-query Branch-2 scores used as the
    # per-query "elevated" cutoff for fraction_above_threshold. RAISED
    # 0.90->0.95 after D3/Superviz25 enlarged Branch 2's benign pool: the
    # benign per-query score distribution is now tightly clustered (this
    # project's own diagnostic session measured p50=5.52, p99=5.94 - a
    # ~0.4-wide band), so the 90th percentile sat inside that cluster rather
    # than past its tail, letting ~10% of individually-normal benign queries
    # count as "elevated" - enough, propagated through fraction_threshold, to
    # push behavior-check FPR on held-out sessions from 0% to 37%. The 95th
    # percentile (~5.94, effectively the cluster's ceiling) restores a clean
    # separation (0% FPR) at recalibration; see report/plan/data_contract.md.
    b2_benign_score_percentile: 0.95

decision:
  # Overkill policy: SQLi=0 & Anomaly=1 -> hold for Admin review.
  overkill_timeout_seconds: 300   # deny-by-default after this
  queue_backend: "sqlite"         # simple, file-backed queue for the MVP
  queue_path: "data/overkill_queue.db"

continual_learning:
  new_data_path: "data/processed/confirmed_labels.jsonl"
  # Rehearsal: fraction of old data mixed with new data during retrain.
  rehearsal_old_fraction: 0.5
  # Validation gate: promote only if new model is at least as good.
  min_f1: null        # null -> must be >= current production model's F1
  max_fpr: null       # null -> must be <= current production model's FPR

monitoring:
  drift_metric: "psi"             # "psi" | "kl"
  psi_alert_threshold: 0.2        # >0.2 commonly treated as significant drift
  retrain_schedule: "weekly"
  metrics_log_path: "data/processed/drift_metrics.jsonl"

# Continual-learning / MLOps loop. Full specification (schemas, invariants, the
# major-bump rule, what the demonstration may and may not claim):
#   report/plan/mlops_contract.md
mlops:
  # Where the data-version registry, archived models and experiment artifacts live.
  data_versions_dir: "data/versions"
  archive_dir: "models/_archive"
  artifacts_dir: "report/metrics/continual_learning"
  # The protected starting point. A demo reset restores exactly this and may
  # never modify or archive it.
  baseline:
    model_version: "branch1_v1"
    data_version: "1.0"
  split:
    # 40 train / 10 golden / 50 stream. `golden` is the frozen benchmark: it is
    # never trained on and never changes within a major version, which is what
    # makes champion/challenger comparisons apples-to-apples.
    train_fraction: 0.4
    golden_fraction: 0.1
    stream_fraction: 0.5
    # Carved out of the train partition, for threshold/early-stopping choices.
    # `golden` is NOT used for this — it stays untouched.
    valid_fraction: 0.15
    seed: 42
  stream:
    # Real SQL traffic is <1% attack; a stream built only from the balanced
    # training file would be ~78% attack and useless for measuring FPR or drift.
    # Benign is therefore padded from the Branch-2 benign pool, excluding rows
    # Branch 2 itself trained on (that would leak into its anomaly scores).
    attack_rate: 0.05
    benign_source: "data/processed/branch2_normal.csv"
    benign_exclude: "data/processed/branch2_data.csv"
    window_size: 1000
    # Fraction of the stream before the new class appears. Phase A must be
    # verified quiet before phase B can be claimed as drift.
    phase_a_fraction: 0.4
    # Class introduced mid-stream to trigger the major bump. NOTE: `stacked` is
    # 100% synthetic (363 templated payloads) - it demonstrates the mechanism
    # only, and its accuracy must not be reported as a detection result.
    new_class: "stacked"
    # Share of phase-B ATTACK traffic that is the new class. The synthetic pool
    # is only a few hundred templates, so it is sampled with replacement to
    # reach this share - realistic (attackers reuse payloads) but recorded in
    # the split manifest, since it inflates the class's apparent volume.
    new_class_share_in_phase_b: 0.3
  drift:
    psi_bins: 10
    # Number of leading stream windows used as the drift REFERENCE. The
    # reference must be production traffic, not the training set: the training
    # file is class-balanced (~78% attack) while real traffic is ~95% benign,
    # so scoring the stream against it measures that construction difference
    # and reports drift from window 0. Baselining on an initial stable period
    # is also what a real deployment does.
    # Lowered 10->5 on 17/08: after the branch2_normal.csv data-source fix
    # (configs/config.yaml branch2_anomaly), the MLOps replay stream pool
    # (train/build_mlops_split.py) shrank a lot — usable benign rows after
    # excluding Branch 1/Branch 2 training overlap dropped from ~76.8K to
    # ~15.4K (those rows are legitimately consumed by Branch 2 training) —
    # 17 windows total, phase A (phase_a_fraction=0.4) only ~6-7 of them.
    # baseline_windows=10 no longer fit inside phase A; 5 was the fix then.
    #
    # UPDATED 19/08: after the D3/D7 URL-wrapper strip (build_branch2_dataset.py)
    # + the anomalous-eval set now also drawing D1/D7 attacks, the usable
    # stream-benign pool shrank further to ~8.7K rows — only 9 windows total,
    # phase A now just ~3 of them. baseline_windows=5 again ate all of phase
    # A (same crash as before, computing phase_a_max on an empty array). 2
    # leaves 1 window of margin under the ~3 phase-A windows.
    baseline_windows: 2
    # Consecutive windows that must breach the threshold before retraining is
    # triggered - a single-window spike is noise.
    sustained_windows: 2
    # Computed side by side. A new class at a 5% attack rate is ~1% of traffic,
    # so `global` may never breach the threshold while `attack_subpop` does;
    # that contrast is a result worth reporting, not a bug.
    populations: ["global", "attack_subpop", "prediction"]
  queue:
    # Which verdicts put a query in front of a human. Defaults to the cases
    # where the model is uncertain - where review pays for itself.
    sources: ["overkill", "anomaly", "low_confidence"]
    # Branch-1 confidence below which a query is queued even if allowed.
    low_confidence_below: 0.6
  gate:
    # Promotion is refused if any known class regresses by more than this.
    max_per_class_recall_drop: 0.02
    min_new_class_recall: 0.80

# Continual-learning scenario experiment: a REAL class held out of the initial
# training pool (not the synthetic `stacked` payloads under mlops.stream above),
# so major-bump accuracy is a genuine detection result. Supersedes `mlops`'s
# stacked-based numbers in the paper (report/conf/rivf2026_paper.tex §III.G/V.E).
cl_scenario:
  artifacts_dir: "report/metrics/cl_scenario"
  seed: 42
  # Class entirely withheld from the initial training pool.
  held_out_class: "union_based"
  golden_fraction: 0.1
  valid_fraction: 0.15
  # Of each KNOWN class's non-golden 90%, the share reserved for the initial
  # training pool ("Base"). The rest is held back for the two pours below and
  # mostly left unused — deliberately, so "half the data, missing one label"
  # stays a true description of Base rather than "nearly everything."
  base_fraction_of_known: 0.5
  stream:
    window_size: 1000
    # Leading windows of each pour used as that pour's drift reference.
    baseline_windows: 2
    # Scenario 1 (major bump): the held-out class appears, mixed with a light
    # trickle of already-known traffic. Sized well below the ~13.5K held-out
    # rows available, and below the ~8.7K usable benign pool
    # (data/processed/branch2_normal.csv minus Branch-1/Branch-2 training
    # overlap) that pads both pours to a plausible attack rate.
    scenario1_new_class_rows: 2000
    scenario1_trickle_rows: 300
    # A benign+trickle head at the start of scenario 1 (no held-out class),
    # sized to baseline_windows * window_size, giving the drift monitor a
    # quiet reference before the held-out class is interleaved in.
    quiet_head_rows: 2000
    # Scenario 2 (minor bump): more volume of the 4 known classes only.
    scenario2_known_rows: 2000
    benign_source: "data/processed/branch2_normal.csv"
    benign_exclude: "data/processed/branch2_data.csv"
  # Confirmed-sample count in the review queue that triggers an automatic
  # retrain — one policy for both bump types, not two thresholds to justify.
  retrain_threshold: 500
  # Minor-bump candidates must additionally survive this many further observed
  # queries in shadow (logged only, champion still serves) before promotion.
  # Major bump skips shadow (see report §III.G): there is no working champion
  # for the new class to regress relative to, so the gate's absolute-floor
  # check already carries the weight shadow exists to provide.
  shadow_window_queries: 2000
  shadow_fpr_tolerance: 0.005
  gate:
    max_per_class_recall_drop: 0.02
    min_new_class_recall: 0.80

api:
  host: "0.0.0.0"
  port: 8000
  title: "SQLi Detection API"
  # API contract version — also the URL prefix (/api/v1/...). Bump on breaking
  # changes so the Streamlit client can pin against a stable shape.
  api_version: "v1"
  # CORS allow-origins for the Streamlit frontend (runs on a different port).
  # "*" is fine for the local demo; tighten for any real deployment.
  cors_origins: ["*"]
